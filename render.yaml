# ═══════════════════════════════════════════════════════════════════
#  TomiOka · Blueprint de Render
#  En Render: New + → Blueprint → elegí este repo y aplicá este archivo.
#  Botón directo: https://render.com/deploy?repo=https://github.com/lyanvalentinmail-prog/TomiOka
#
#  Levanta SOLO el panel web (web/ servido por scripts/serve-web.js).
#  El bot de WhatsApp (Baileys) sigue corriendo donde lo tengas
#  (Termux/VPS): necesita sesión persistente y proceso siempre activo.
# ═══════════════════════════════════════════════════════════════════
services:
  - type: web
    name: tomioka-panel
    runtime: node
    plan: free
    # El panel no necesita compilar nada: es HTML/CSS/JS servido por Node.
    buildCommand: echo "Panel web listo (sin paso de build)"
    # serve-web.js escucha en process.env.PORT, que Render asigna solo.
    startCommand: node scripts/serve-web.js
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
